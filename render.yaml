services:
  - type: web
    name: studyhub
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
  - key: OPENAI_API_KEY
    sync: false
  - key: OPENAI_BASE_URL
    value: https://generativelanguage.googleapis.com/v1beta/openai/
  - key: OPENAI_MODEL
    value: gemini-2.5-flash